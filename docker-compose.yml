services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexuscloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: nexuscloud
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexuscloud"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nexuscloud:${POSTGRES_PASSWORD}@postgres:5432/nexuscloud
      REDIS_URL: redis://redis:6379/0
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nexuscloud:${POSTGRES_PASSWORD}@postgres:5432/nexuscloud
      REDIS_URL: redis://redis:6379/0
    ports:
      - "7575:7575"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:7575/health', timeout=2)"]
      interval: 10s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:7575}
    environment:
      CSP_CONNECT_SRC: "'self' https: http://localhost:7575"
    ports:
      - "8080:8080"
    depends_on:
      - api
  worker:
    build: .
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=info"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nexuscloud:${POSTGRES_PASSWORD}@postgres:5432/nexuscloud
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  beat:
    build: .
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=info", "-s", "/tmp/celerybeat-schedule"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nexuscloud:${POSTGRES_PASSWORD}@postgres:5432/nexuscloud
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
