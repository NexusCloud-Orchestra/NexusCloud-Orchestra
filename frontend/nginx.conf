# NexusCloud Orchestra — static SPA server config.
# Root serves the built assets; unknown paths fall back to index.html so
# client-side routes (/app/files, /app/settings, …) work on hard reload.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers mirroring the API's guardrails where meaningful for the SPA.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # Hashed assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Unauthenticated health probe.
  location = /health {
    access_log off;
    return 200 'ok';
    add_header Content-Type "text/plain" always;
  }

  # SPA fallback: every unknown path renders the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
