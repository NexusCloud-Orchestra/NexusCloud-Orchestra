name: Verify and publish

on:
  pull_request:
  push:
    branches: [dev, main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.12.21
      - name: Install locked dependencies
        run: uv sync --locked --extra test
      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes \
            --output-file "$RUNNER_TEMP/requirements-audit.txt" >/dev/null
          uvx pip-audit==2.10.1 --no-deps --progress-spinner off \
            -r "$RUNNER_TEMP/requirements-audit.txt"
      - name: Test API
        run: uv run --frozen pytest tests/test_backend.py -q
      - name: Check fresh database migration
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-migration.db
          SECRET_KEY: ci-access-secret-0123456789abcdef0123456789
          ENCRYPTION_KEY: ci-encryption-secret-0123456789abcdef
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen alembic check
      - name: Build wheel
        run: uv build --wheel

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Check cross-language stripe index
        working-directory: frontend
        run: npm run test:striping
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate
      - name: Typecheck and build
        working-directory: frontend
        env:
          VITE_API_URL: https://api.example.com
        run: npm run build

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nexuscloud-api:smoke
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: nexuscloud-web:smoke
          build-args: |
            VITE_API_URL=https://api.example.com
      - name: Smoke-test both images
        run: |
          set -euo pipefail
          trap 'docker rm -f nexuscloud-api-smoke nexuscloud-web-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name nexuscloud-api-smoke -p 7575:7575 \
            -e DATABASE_URL=sqlite+aiosqlite:////tmp/nexuscloud-smoke.db \
            -e SECRET_KEY=ci-access-secret-0123456789abcdef0123456789 \
            -e ENCRYPTION_KEY=ci-encryption-secret-0123456789abcdef \
            nexuscloud-api:smoke \
            sh -c 'alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 7575 --no-access-log'
          docker run -d --name nexuscloud-web-smoke -p 8080:8080 nexuscloud-web:smoke
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:7575/health
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/health
          curl --fail http://127.0.0.1:8080/app/files | grep -q '<div id="root">'

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Require public API URL
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: test -n "$VITE_API_URL"
      - name: Image names
        id: images
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.images.outputs.prefix }}-api:${{ github.ref_name }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.images.outputs.prefix }}-web:${{ github.ref_name }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
