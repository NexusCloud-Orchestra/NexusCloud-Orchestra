[project]
name = "nexuscloud"
version = "0.1.0"
description = "NexusCloud multi-cloud storage control plane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "boto3>=1.43.28",
    "bcrypt>=5.0.0",
    "azure-storage-blob>=12.31.0",
    "celery>=5.6.3",
    "cryptography>=50.0.0",
    "fastapi>=0.136.3",
    "google-cloud-storage>=3.11.0",
    "httpx>=0.28.1",
    "oci>=2.187.1",
    "pydantic-settings>=2.14.1",
    "pydantic[email]>=2.13.4",
    "python-dotenv>=1.2.2",
    "PyJWT>=2.12.1",
    "redis>=8.0.0",
    "sqlalchemy>=2.0.50",
    "uvicorn[standard]>=0.49.0",
]

[project.optional-dependencies]
test = ["pytest>=9", "pytest-asyncio>=1.4", "aiosqlite>=0.22", "fakeredis>=2.39"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
